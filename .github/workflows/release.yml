# Builds the installable binaries.
#
# A tag like v0.2.0 publishes a GitHub release with one archive per platform
# and a .sha256 next to each; install.sh downloads from there. The tag can be
# pushed, or made on GitHub's "Draft a new release" page; either way the
# binaries are attached to that release. Running the
# workflow by hand builds the same archives as workflow artifacts, without
# releasing anything.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release --locked -p displaylab --target aarch64-apple-darwin
          cargo build --release --locked -p displaylab --target x86_64-apple-darwin
      - name: One universal binary
        run: |
          mkdir -p dist/pkg
          lipo -create -output dist/pkg/displaylab \
            target/aarch64-apple-darwin/release/displaylab \
            target/x86_64-apple-darwin/release/displaylab
          # lipo drops the slices' ad-hoc signatures; Apple Silicon will not
          # run an unsigned binary.
          codesign --force --sign - dist/pkg/displaylab
          lipo -info dist/pkg/displaylab
          dist/pkg/displaylab --version
          dist/pkg/displaylab run --backend fake --out dist/check catalogue
      - name: Package
        run: |
          cp README.md LICENSE-MIT LICENSE-APACHE dist/pkg/
          tar -czf dist/displaylab-macos.tar.gz -C dist/pkg .
          cd dist && shasum -a 256 displaylab-macos.tar.gz > displaylab-macos.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: displaylab-macos
          path: dist/displaylab-macos.tar.gz*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p displaylab
      - name: Package
        run: |
          mkdir -p dist/pkg
          cp target/release/displaylab README.md LICENSE-MIT LICENSE-APACHE dist/pkg/
          dist/pkg/displaylab run --backend fake --out dist/check catalogue
          tar -czf dist/displaylab-linux-x86_64.tar.gz -C dist/pkg .
          cd dist && sha256sum displaylab-linux-x86_64.tar.gz > displaylab-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: displaylab-linux
          path: dist/displaylab-linux-x86_64.tar.gz*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p displaylab
      - name: The display driver
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_DRIVER_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_DRIVER_PFX_PASSWORD }}
        run: |
          # Signed with the project's certificate, kept as a repository
          # secret (ci/new-driver-certificate.ps1 makes one). Without it the
          # release still ships, without virtual screens on Windows.
          if (-not $env:PFX) {
            "::warning::WINDOWS_DRIVER_PFX is not set, so this release has no Windows display driver"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'driver.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX))
          ./ci/build-windows-driver.ps1 -Out dist/pkg/driver -Pfx $pfx -PfxPassword $env:PFX_PASSWORD
          $code = $LASTEXITCODE
          Remove-Item $pfx
          exit $code
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/pkg | Out-Null
          Copy-Item target/release/displaylab.exe, README.md, LICENSE-MIT, LICENSE-APACHE dist/pkg/
          dist/pkg/displaylab.exe run --backend fake --out dist/check catalogue
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/pkg/* -DestinationPath dist/displaylab-windows-x86_64.zip
          $hash = (Get-FileHash dist/displaylab-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  displaylab-windows-x86_64.zip" | Out-File -Encoding ascii -NoNewline dist/displaylab-windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: displaylab-windows
          path: dist/displaylab-windows-x86_64.zip*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # A release made on GitHub's "Draft a new release" page already
          # exists by now; add the binaries to it. A pushed tag has none yet.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
