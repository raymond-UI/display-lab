name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The whole lab, end to end, on the fake backend. Needs no display.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace
      - name: Catalogue passes against a good app
        run: ./target/debug/displaylab run --backend fake scenarios/catalogue/*.toml scenarios/fake-presenter/*.toml scenarios/smoke/*.toml
      - name: Catalogue fails against a broken app
        shell: bash
        run: |
          set +e
          ./target/debug/displaylab run --backend fake --fake-bug ignore-hotplug --out out-broken scenarios/catalogue/*.toml
          code=$?
          echo "exit code $code"
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-linux
          path: |
            out
            out-broken

  # Compiles the macOS backend (it is cfg-gated out everywhere else) and runs
  # the platform-neutral tests on macOS.
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Experiment: can a hosted macOS runner create and capture a virtual screen?
  # Screen Recording is granted by writing the system TCC database, which is
  # unsupported by Apple and may stop working on a future image.
  macos-virtual-screen:
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - name: Describe the runner
        run: |
          sw_vers
          csrutil status || true
          system_profiler SPDisplaysDataType || true
      - name: Grant Screen Recording
        run: bash ci/grant-screen-recording.sh "$PWD/target/debug/displaylab" "$PWD/target/debug/displaylab-screen-host"
      - name: Diagnose one virtual screen by hand
        continue-on-error: true
        run: |
          echo "--- before"
          python3 ci/list-displays.py
          mkfifo /tmp/hold
          ./target/debug/displaylab-screen-host --name "Lab HD Projector" --vendor 7440 --product 1280 --serial 2001 \
            --width 1920 --height 1080 --refresh 60 < /tmp/hold > /tmp/host.out 2>&1 &
          exec 3>/tmp/hold
          for i in 1 2 3 4 5 6; do sleep 2; echo "--- after $((i*2)) s, host said: $(cat /tmp/host.out)"; python3 ci/list-displays.py; done
          system_profiler SPDisplaysDataType || true
          exec 3>&-
          sleep 3
          echo "--- after the host exits"
          python3 ci/list-displays.py
      - name: Smoke test on the real backend
        env:
          DISPLAYLAB_DEBUG: "1"
        run: ./target/debug/displaylab run --backend mac --adapter "python3 adapters/example-python/adapter.py" scenarios/smoke/virtual-screen.toml
      - name: Displays afterwards
        if: always()
        run: system_profiler SPDisplaysDataType || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-macos
          path: out

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace
      - name: Catalogue passes against a good app
        shell: bash
        run: ./target/debug/displaylab.exe run --backend fake scenarios/catalogue/*.toml scenarios/fake-presenter/*.toml

  # Experiment: can a hosted Windows runner install the Virtual Display
  # Driver and get a new monitor? The answer decides how lab-win is built.
  windows-display-driver:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/probe-virtual-display-driver.ps1
