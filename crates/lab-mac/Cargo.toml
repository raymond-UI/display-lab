[package]
name = "lab-mac"
description = "Display Lab's macOS backend: CGVirtualDisplay screens (one host process each) and ScreenCaptureKit capture."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# One of these runs per virtual screen. The window server removes a virtual
# display when the process that created it exits, so killing this process is
# the cleanest possible cable pull, and a crash cannot leak a screen.
name = "displaylab-screen-host"
path = "src/bin/screen_host.rs"

[dependencies]
lab-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = "0.3"
screencapturekit = "12"

[lints]
workspace = true
